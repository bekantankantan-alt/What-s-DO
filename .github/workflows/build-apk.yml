name: Build Tugas Harian APK from ZIP

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o TugasHarian_GitHub_APK_SingleZIP.zip -d project
          test -f project/settings.gradle

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: project
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Tugas-Harian-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
