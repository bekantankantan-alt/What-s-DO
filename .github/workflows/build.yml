name: Build WHAT S DO APK

on:
  workflow_dispatch:
  push:
    paths:
      - "WHAT_S_DO_ANDROID_SINGLE_UPLOAD.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Do not call android-actions/setup-android: its default package list
      # includes the obsolete SDK package "tools" and fails on current SDK repos.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract Android project
        run: |
          test -f WHAT_S_DO_ANDROID_SINGLE_UPLOAD.zip
          mkdir -p project
          unzip -q WHAT_S_DO_ANDROID_SINGLE_UPLOAD.zip -d project
          test -f project/settings.gradle
          test -f project/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        run: gradle -p project --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WHAT-S-DO-DEBUG-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
